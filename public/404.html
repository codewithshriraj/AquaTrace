<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AquaTrace — Maritime Oil Spill Traceback & Vessel Attribution</title>
    <script type="text/javascript">
      // GitHub Pages SPA Single Page App Routing Script
      // Preserves subroute path and redirects to index.html with hash route
      var path = window.location.pathname;
      var repo = '/AquaTrace';
      if (path.startsWith(repo)) {
        var subpath = path.slice(repo.length);
        window.location.replace(repo + '/#' + subpath + window.location.search);
      } else {
        window.location.replace('/#' + path + window.location.search);
      }
    </script>
  </head>
  <body style="background-color: #0b1622; color: #38bdf8; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2>🛰️ AquaTrace</h2>
      <p style="color: #94a3b8;">Redirecting to console investigation workspace...</p>
    </div>
  </body>
</html>
